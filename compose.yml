# ============================================================
# EllenSings: два контейнера
#
#   gateway — tun2socks + kill-switch. Единственный контейнер
#             с NET_ADMIN и доступом к /dev/net/tun.
#   bot     — Discord-бот. Непривилегированный, без capabilities,
#             read-only rootfs. Живёт в network namespace шлюза
#             (network_mode: service:gateway), поэтому весь его
#             трафик проходит через туннель и kill-switch.
#
# Требование к хосту: modprobe tun (модуль обычно загружен).
# Требование к прокси: SOCKS5 с поддержкой UDP ASSOCIATE,
# иначе Discord Voice (UDP) не заработает.
# ============================================================

services:
  gateway:
    build: ./gateway
    image: ${GATEWAY_IMAGE:-ellensings-gateway:latest}
    container_name: ellensings-gateway
    restart: unless-stopped

    # Единственная привилегия — NET_ADMIN (TUN, маршруты, iptables)
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # /run — конфиг tun2socks и xtables.lock
      - /run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    volumes:
      - ./gateway/resolv.conf:/etc/resolv.conf:ro

    environment:
      - TZ=${TZ:-Europe/Moscow}
      # Прокси задаётся в .env; URL с кредами в логи не попадает
      - PROXY_URL=${PROXY_URL:?PROXY_URL is required, e.g. socks5://host.docker.internal:2080}

    # Оба контейнера используют общий статический resolv.conf с локальным
    # Unbound в network namespace шлюза. Unbound отправляет DNS-over-TLS
    # через TUN; Docker embedded DNS при этом не используется.

    # host.docker.internal -> IP хоста (для прокси, запущенного на хосте)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # IPv6 отключаем: TUN-маршрут обслуживает только IPv4,
    # IPv6 мог бы стать каналом утечки мимо прокси
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

    networks:
      - bot-net

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: ${BOT_IMAGE:-ellensings-bot:latest}
    container_name: ellensings-bot
    restart: unless-stopped

    # Бот стартует только когда туннель реально работает.
    # restart: true — при перезапуске шлюза (новый netns) бот перезапускается тоже.
    depends_on:
      gateway:
        condition: service_healthy
        restart: true

    # Общий network namespace со шлюзом: весь трафик — через туннель
    network_mode: "service:gateway"

    # Никаких привилегий и записи на диск
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # heartbeat-файл, HOME и временные файлы yt-dlp/ffmpeg
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - ./gateway/resolv.conf:/etc/resolv.conf:ro

    environment:
      - TZ=${TZ:-Europe/Moscow}
      # Токен подставляется из .env (не коммитить!). Для продакшена используй
      # отдельный токен и/или Docker secrets: бот понимает DISCORD_TOKEN_FILE
      # (путь к файлу с токеном, например /run/secrets/discord_token).
      - DISCORD_TOKEN=${DISCORD_TOKEN:?DISCORD_TOKEN is required}

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Постоянная выделенная сеть для доступа к Xray на хосте.
# Создаётся один раз:
#   docker network create --driver bridge \
#     --subnet 172.29.0.0/24 --gateway 172.29.0.1 xray-proxy
# Xray слушает только gateway-адрес этой сети (172.29.0.1), поэтому
# inbound недоступен из LAN и интернета.
networks:
  bot-net:
    name: xray-proxy
    external: true
